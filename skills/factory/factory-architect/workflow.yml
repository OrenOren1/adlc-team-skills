# Curated lifecycle definition — factory-architect (ADR-391-amendment).
# Plan-of-record for the architecture lifecycle; dual-executor (ADR-395):
# in-session the LLM executor drives these steps via `workflow state` helpers
# (gates inline); headless `adlc-cli workflow run` executes this file directly.
# Twin: skills/factory/factory-product/workflow.yml (same shape, product-*).
#
# Correction loop: `analyze` is instructed to end its report with a terminal
# `VERDICT: OK | HIGH | CRITICAL` line; HIGH/CRITICAL re-runs the bounded
# build-and-verify cycle (max_iterations = 1 + mission max_corrections, default 2).
# The adaptive executor may route a correction back through architect-clarify
# before re-implementing (executor.md correction loop); the headless loop is a
# bounded re-implementation.
schema_version: "1.0"
workflow:
  id: factory-architect
  name: Architecture Lifecycle
  version: "1.0.0"
inputs:
  route:
    type: string
    enum: ["", greenfield, brownfield, refresh]
    default: greenfield
  verdict:
    type: string
    enum: ["", approve, reject]
steps:
  - id: specify
    type: command
    command: architect-specify
  - id: clarify
    type: command
    command: architect-clarify
  - id: gate-decisions
    type: gate
    message: "ADR decisions drafted and clarified. Approve before AD.md generation?"
    options: [approve, reject]
    on_reject: retry
    verdict_input: verdict
  - id: build-and-verify
    type: do-while
    condition: "{{ steps.analyze.output.stdout | contains('VERDICT: CRITICAL') or steps.analyze.output.stdout | contains('VERDICT: HIGH') }}"
    max_iterations: 3
    steps:
      - id: implement
        type: command
        command: architect-implement
      - id: analyze
        type: command
        command: architect-analyze
